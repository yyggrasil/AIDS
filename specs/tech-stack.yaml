project:
  name: "AIDS-Alternative-Traffic-Detection"
  description: "Sistema de Detecção de Intrusão Baseado em Anomalias e Assinaturas (AIDS) utilizando Stacking Ensemble (LinearSVC Calibrado + Random Forest + Extra Trees + HistGradientBoosting + Decision Tree) com Meta-Classificador de Regressão Logística em modos Binário, Multiclasse e Cascata com Decision Tree de segundo estágio no Edge (Raspberry Pi)"
  version: "1.0.0"
  domain: "Cybersecurity / Intrusion Detection System (AIDS)"

environment:
  python:
    version: ">=3.10"
  virtual_environment:
    mandatory: true
    tool: "venv"
    directory: ".venv"
    activation:
      windows: ".venv\\Scripts\\activate"
      linux_mac: "source .venv/bin/activate"
    description: "Ambiente virtual Python (.venv) obrigatório para isolamento e reprodutibilidade das dependências de Machine Learning."
  configuration:
    tool: "python-dotenv"
    file: ".env"
    description: "Arquivo de configuração dinâmico para controle de amostragem, toggles de treinamento de modelos e modos de execução (binário/multiclasse)."
    environment_variables:
      - name: "TRAIN_LINEARSVC"
        type: "bool"
        default: "True"
        description: "Habilita ou desabilita o treinamento do modelo LinearSVC isolado."
      - name: "TRAIN_DT"
        type: "bool"
        default: "True"
        description: "Habilita ou desabilita o treinamento do modelo Decision Tree isolado (gera também models/dt_pipeline_{mode}.joblib)."
      - name: "TRAIN_RF"
        type: "bool"
        default: "True"
        description: "Habilita ou desabilita o treinamento do modelo Random Forest isolado."
      - name: "TRAIN_ET"
        type: "bool"
        default: "False"
        description: "Habilita ou desabilita o treinamento do modelo Extra Trees isolado."
      - name: "TRAIN_HGB"
        type: "bool"
        default: "False"
        description: "Habilita ou desabilita o treinamento do modelo HistGradientBoosting isolado."
      - name: "TRAIN_MLP"
        type: "bool"
        default: "True"
        description: "Habilita ou desabilita o treinamento da Mini Rede Neural (MLPClassifier) isolada."
      - name: "TRAIN_STACKING"
        type: "bool"
        default: "True"
        description: "Habilita ou desabilita o treinamento do Stacking Ensemble."
      - name: "STACKING_PROFILE"
        type: "str"
        default: "edge"
        description: "Perfil de estimadores do Stacking ('edge', 'balanced', 'performance', 'legacy')."
      - name: "STACKING_CV_SPLITS"
        type: "int"
        default: "5"
        description: "Divisões estratificadas para validação cruzada out-of-fold no Stacking."
      - name: "STACKING_PASSTHROUGH"
        type: "bool"
        default: "False"
        description: "Concatena features de entrada pré-processadas às meta-features de probabilidade."
      - name: "STACKING_N_JOBS"
        type: "int"
        default: "2"
        description: "Número de workers concorrentes para a validação cruzada do Stacking (padrão 2 para evitar exaustão de memória/OOM no Linux)."
      - name: "RUN_BINARY"
        type: "bool"
        default: "True"
        description: "Executa o pipeline em modo de classificação binária (Benigno vs Maligno)."
      - name: "RUN_MULTICLASS"
        type: "bool"
        default: "False"
        description: "Executa o pipeline em modo de classificação multiclasse (classes específicas de ataque)."
      - name: "SAMPLE_FRAC"
        type: "float"
        default: "0.1"
        description: "Fração de amostragem estratificada do dataset (ex: 0.01 = 1%, 0.1 = 10%, 1.0 = 100%)."

    edge_configuration:
      tool: "python-dotenv"
      file: "raspberry_pi/.env"
      description: "Arquivo de configuração isolado com prioridade para captura de rede, inferência em borda, alertas SMTP e rotação de logs no Raspberry Pi."
      environment_variables:
        - name: "NETWORK_INTERFACE"
          type: "str"
          default: "eth0"
          description: "Interface de rede física/virtual para captura promíscua de pacotes."
        - name: "DETECTION_MODE"
          type: "str"
          default: "binary"
          description: "Modo de inferência do detector: 'binary', 'multiclass' ou 'cascade'."
        - name: "ALERT_THRESHOLD"
          type: "float"
          default: "0.50"
          description: "Limiar de probabilidade para disparar alarme de intrusão maliciosa."
        - name: "USE_DT_MULTICLASS_FOR_ATTACKS"
          type: "bool"
          default: "True"
          description: "Aciona o classificador DT multiclasse (Estágio 2) para identificar a classe exata de ataque."
        - name: "DT_MULTICLASS_MODEL_PATH"
          type: "str"
          default: "models/dt_pipeline_multiclass.joblib"
          description: "Caminho do modelo/pipeline Decision Tree multiclasse serializado."
        - name: "FLOW_INACTIVITY_TIMEOUT"
          type: "float"
          default: "10.0"
          description: "Segundos de inatividade antes de finalizar e classificar um fluxo de rede."
        - name: "FLOW_ACTIVE_TIMEOUT"
          type: "float"
          default: "60.0"
          description: "Duração contínua máxima de um fluxo ativo antes de forçar predição."
        - name: "PORT_SCAN_THRESHOLD"
          type: "int"
          default: "15"
          description: "Portas distintas sondadas em 5s para acionar detecção heurística de Reconnaissance."
        - name: "CONN_FLOOD_THRESHOLD"
          type: "int"
          default: "20"
          description: "Conexões TCP em 2s para acionar detecção heurística de DoS."
        - name: "IGNORE_BROADCAST_MULTICAST"
          type: "bool"
          default: "True"
          description: "Filtra tráfego de broadcast/multicast legítimo para evitar falsos positivos."
        - name: "IGNORE_LOCAL_DISCOVERY_PORTS"
          type: "str"
          default: "1900,5353,5355,137,138,27036,67,68"
          description: "Portas de serviços benignos de rede ignoradas (SSDP, mDNS, LLMNR, NetBIOS, Steam, DHCP)."
        - name: "DRY_RUN"
          type: "bool"
          default: "False"
          description: "Executa a engine em modo de teste e simulação sem disparo real de alertas SMTP."
        - name: "LOG_FILE"
          type: "str"
          default: "logs/aids_rpi.log"
          description: "Arquivo de log operacional de execução do serviço AIDS-RPi."
        - name: "ALERT_EMAIL_ENABLED"
          type: "bool"
          default: "True"
          description: "Habilita envio de e-mails de alerta de segurança via SMTP seguro."
        - name: "SMTP_HOST"
          type: "str"
          default: "smtp.gmail.com"
        - name: "SMTP_PORT"
          type: "int"
          default: "587"
        - name: "SMTP_USE_TLS"
          type: "bool"
          default: "True"
        - name: "SMTP_USE_SSL"
          type: "bool"
          default: "False"
        - name: "SMTP_USER"
          type: "str"
          default: "seu_email@gmail.com"
        - name: "SMTP_PASS"
          type: "str"
          default: "sua_senha_de_app_aqui"
        - name: "ALERT_SENDER"
          type: "str"
          default: "aids-rpi@antigravity.local"
        - name: "ALERT_RECIPIENT"
          type: "str"
          default: "admin_seguranca@empresa.com,soc@empresa.com"
        - name: "COOLDOWN_SECONDS"
          type: "float"
          default: "60.0"
          description: "Janela anti-flood para agregação e supressão de alertas repetidos da mesma ameaça."
        - name: "DETECTION_LOG_ENABLED"
          type: "bool"
          default: "True"
          description: "Habilita gravação persistente das detecções e auditoria em disco."
        - name: "DETECTION_LOG_FILE"
          type: "str"
          default: "logs/detections.jsonl"
        - name: "DETECTION_LOG_FORMAT"
          type: "str"
          default: "jsonl"
          description: "Formato do log: 'jsonl', 'csv', 'text' ou 'all'."
        - name: "DETECTION_LOG_MAX_BYTES"
          type: "int"
          default: "5242880"
          description: "Tamanho máximo por arquivo antes da rotação automática (5 MB)."
        - name: "DETECTION_LOG_BACKUP_COUNT"
          type: "int"
          default: "3"
          description: "Número de cópias rotacionadas mantidas (.1, .2, .3)."
        - name: "DETECTION_LOG_ALL_FLOWS"
          type: "bool"
          default: "False"
          description: "Grava todos os fluxos de rede (True) ou apenas intrusões detectadas (False)."

core_libraries:
  data_manipulation:
    - name: "pandas"
      version: ">=2.1.0"
      purpose: "Carregamento de dados CSV, limpeza de cabeçalhos, amostragem estratificada com tratamento de classes raras e descarte de colunas irrelevantes."
    - name: "numpy"
      version: ">=1.26.0"
      purpose: "Operações vetoriais, conversão e casting para float32 e substituição de infinitos por NaN."
  configuration_management:
    - name: "python-dotenv"
      version: ">=1.0.0"
      purpose: "Carregamento automático de variáveis de ambiente a partir do arquivo .env."

machine_learning:
  framework: "scikit-learn"
  version: ">=1.3.0"
  execution_modes:
    - name: "binary"
      description: "Classificação em duas classes: Benigno (0) vs Maligno (1)."
    - name: "multiclass"
      description: "Classificação nos tipos específicos de ataques presentes no dataset."
    - name: "cascade"
      description: "Classificação em dois estágios: Estágio 1 Stacking Binário (Benigno vs Maligno) seguido por Estágio 2 Decision Tree Multiclasse para especialização do tipo de ataque."
  components:
    base_learners:
      - name: "Linear Support Vector Classifier (LinearSVC)"
        module: "sklearn.svm.LinearSVC"
        hyperparameters:
          C: 1.0
          loss: "squared_hinge"
          dual: "auto"
          tol: 1e-3
          max_iter: 5000
          class_weight: "balanced"
          random_state: 42
        purpose: "Classificador linear de margens rígidas em complexidade O(N), com balanceamento de classes e tolerância acelerada."

      - name: "Calibrated LinearSVC"
        module: "sklearn.calibration.CalibratedClassifierCV"
        hyperparameters:
          estimator: "LinearSVC(C=1.0, loss='squared_hinge', dual='auto', tol=1e-3, max_iter=5000, class_weight='balanced', random_state=42)"
          cv: 3
        purpose: "Empacotamento do LinearSVC para calibração de probabilidades isotônicas/sigmoides necessárias para integração probabilística no Stacking."

      - name: "Random Forest Classifier"
        module: "sklearn.ensemble.RandomForestClassifier"
        hyperparameters:
          n_estimators: 100
          max_depth: 15
          min_samples_split: 4
          min_samples_leaf: 2
          max_features: "sqrt"
          class_weight: "balanced"
          n_jobs: 1
          random_state: 42
        purpose: "Ensemble de árvores por bagging com controle de profundidade para redução de variância e balanceamento de classes."

      - name: "Extra Trees Classifier"
        module: "sklearn.ensemble.ExtraTreesClassifier"
        hyperparameters:
          n_estimators: 100
          max_depth: 15
          min_samples_split: 4
          min_samples_leaf: 2
          max_features: "sqrt"
          class_weight: "balanced"
          n_jobs: 1
          random_state: 42
        purpose: "Ensemble de árvores com cortes extremamente aleatorizados para maximizar diversidade dos estimadores base do Stacking."

      - name: "Decision Tree Classifier"
        module: "sklearn.tree.DecisionTreeClassifier"
        hyperparameters:
          criterion: "entropy"
          max_depth: 15
          min_samples_split: 5
          min_samples_leaf: 2
          ccp_alpha: 0.0001
          class_weight: "balanced"
          random_state: 42
        purpose: "Árvore de decisão com critério de ganho de informação (entropia) e poda de complexidade de custo (ccp_alpha) para regras de decisão limpas."

      - name: "HistGradientBoosting Classifier"
        module: "sklearn.ensemble.HistGradientBoostingClassifier"
        hyperparameters:
          max_iter: 100
          max_depth: 12
          min_samples_leaf: 20
          learning_rate: 0.1
          class_weight: "balanced"
          random_state: 42
        purpose: "Ensemble de árvores com gradient boosting e binning de histograma para aprendizado rápido e modelagem não-linear de resíduos de erro."

      - name: "Mini Neural Network (MLPClassifier)"
        module: "sklearn.neural_network.MLPClassifier"
        hyperparameters:
          hidden_layer_sizes: [64, 32]
          activation: "relu"
          solver: "adam"
          alpha: 0.0001
          batch_size: 128
          learning_rate: "adaptive"
          learning_rate_init: 0.001
          max_iter: 200
          early_stopping: true
          n_iter_no_change: 10
          validation_fraction: 0.1
          random_state: 42
        purpose: "Mini Rede Neural Multi-Layer Perceptron compacta de 2 camadas ocultas para mapeamento não-linear de tráfego de rede e benchmark comparativo com modelos baseados em árvores e SVM."

    meta_learner:
      name: "Logistic Regression"
      module: "sklearn.linear_model.LogisticRegression"
      hyperparameters:
        C: 1.0
        class_weight: "balanced"
        solver: "lbfgs"
        max_iter: 2000
        random_state: 42
      purpose: "Meta-classificador de Nível 1 que aprende a ponderação balanceada e regularizada ótima sobre as probabilidades preditas pelos estimadores base."

    stacking_ensemble:
      module: "sklearn.ensemble.StackingClassifier"
      default_profile: "edge"
      profiles:
        edge:
          - "linearsvcCalibrated"
          - "hgb"
          - "rf"
        balanced:
          - "linearsvcCalibrated"
          - "rf"
          - "et"
          - "hgb"
        performance:
          - "linearsvcCalibrated"
          - "rf"
          - "et"
          - "hgb"
          - "mlp"
        legacy:
          - "linearsvcCalibrated"
          - "rf"
          - "et"
          - "dt"
      final_estimator: "LogisticRegression(C=1.0, class_weight='balanced', solver='lbfgs', max_iter=2000, random_state=42)"
      cross_validation: "StratifiedKFold(n_splits=5, shuffle=True, random_state=42)"
      stack_method: "auto"
      passthrough: false
      n_jobs: 2  # Configurável via STACKING_N_JOBS (default: 2 para proteção de memória)
      purpose: "Combinação hierárquica em camadas dos estimadores base com calibração isotônica e geração out-of-fold de meta-atributos sem vazamento de dados."

    two_stage_cascade:
      description: "Arquitetura hierárquica de dois estágios para inferência ultrarrápida e especializada no Edge."
      stage_1:
        model: "StackingClassifier (Binary Mode)"
        artifact: "./models/stacking_pipeline_binary.joblib"
        purpose: "Detecção ultrarrápida de anomalia binária (Benigno vs Maligno com limiar de 0.50)."
      stage_2:
        model: "DecisionTreeClassifier (Multiclass Pipeline)"
        artifact: "./models/dt_pipeline_multiclass.joblib"
        purpose: "Identificação precisa da família do ataque (DoS, Reconnaissance, Exploits, Fuzzers, Generic, Backdoor, Worms, Analysis, Shellcode)."
      fallback_logic: "Caso a classe majoritária na DT seja Benign após confirmação de ataque no Estágio 1, seleciona automaticamente a classe de ataque com maior probabilidade relativa entre as classes malignas."

    heuristic_detection:
      description: "Camada híbrida de detecção imediata baseada em correlação de tráfego em janelas deslizantes (Scapy / FlowAggregator)."
      port_scan_reconnaissance:
        window_seconds: 5.0
        threshold_ports: 15
        label: "Reconnaissance"
        confidence: 0.99
      connection_flood_dos:
        window_seconds: 2.0
        threshold_connections: 20
        label: "DoS"
        confidence: 0.99

feature_engineering_and_preprocessing:
  pipeline_structure: "ColumnTransformer com Pipelines dedicados para variáveis numéricas e categóricas"
  scaling:
    - name: "Log1p + StandardScaler (log_standard - padrão de produção)"
      module: "sklearn.preprocessing.FunctionTransformer + sklearn.preprocessing.StandardScaler"
      purpose: "Transformação logarítmica ln(1 + max(x,0)) para comprimir atributos com assimetria extrema (durações, taxas, bytes) seguida de padronização Z-score."
    - name: "RobustScaler (modo alternativo 'robust')"
      module: "sklearn.preprocessing.RobustScaler"
      purpose: "Escalonamento numérico robusto baseado em mediana e IQR para amortecer o impacto de outliers de tráfego."
    - name: "StandardScaler (modo alternativo 'standard')"
      module: "sklearn.preprocessing.StandardScaler"
      purpose: "Padronização Z-score direta sem transformação logarítmica."

  imputation_and_selection:
    - name: "SimpleImputer"
      module: "sklearn.impute.SimpleImputer"
      purpose: "Preenchimento de valores ausentes (estratégia 'median' para numéricos e 'constant' com valor 'missing' para categóricos)."
    - name: "VarianceThreshold"
      module: "sklearn.feature_selection.VarianceThreshold"
      threshold: 0.0
      purpose: "Remoção automática de atributos com variância zero após a etapa de imputação."

  encoding:
    - name: "OneHotEncoder"
      module: "sklearn.preprocessing.OneHotEncoder"
      hyperparameters:
        handle_unknown: "ignore"
        dtype: "np.float32"
      purpose: "Codificação One-Hot otimizada em float32 para variáveis categóricas (ex: atributo Protocol)."

  imbalance_handling:
    - name: "class_weight"
      purpose: "Ponderação automática 'balanced' incorporada aos modelos LinearSVC, Random Forest, Extra Trees e Decision Tree para compensar desproporção entre tráfego benigno e ataques."

  feature_dropping:
    identifiers:
      - "Flow ID"
      - "Src IP"
      - "Dst IP"
      - "Timestamp"
    constants:
      - "Bwd PSH Flags"
      - "Fwd URG Flags"
      - "Bwd URG Flags"
      - "URG Flag Count"
      - "CWR Flag Count"
      - "ECE Flag Count"
      - "Fwd Bytes/Bulk Avg"
      - "Fwd Packet/Bulk Avg"
      - "Fwd Bulk Rate Avg"

model_persistence:
  library: "joblib"
  version: ">=1.3.0"
  target_directory: "./models"
  format: ".joblib"
  naming_pattern: "models/{model_name}_{target_mode}.joblib"
  saved_artifacts:
    - name: "stacking_pipeline"
      path: "./models/stacking_pipeline_{target_mode}.joblib"
      description: "Pipeline completo unificado contendo o ColumnTransformer e o Stacking Classifier treinado."
    - name: "dt_pipeline"
      path: "./models/dt_pipeline_{target_mode}.joblib"
      description: "Pipeline completo unificado contendo o ColumnTransformer e o Decision Tree Classifier treinado (usado no Estágio 2 de inferência multiclasse no Edge)."
    - name: "scaler"
      path: "./models/scaler_{target_mode}.joblib"
      description: "Objeto ColumnTransformer pré-processador ajustado (scaler, imputer, one-hot encoder e variance threshold)."
    - name: "meta_learner"
      path: "./models/meta_learner_{target_mode}.joblib"
      description: "Meta-classificador final de Regressão Logística extraído do Stacking."
    - name: "individual_models"
      paths:
        - "./models/LinearSVC_{target_mode}.joblib"
        - "./models/DT_{target_mode}.joblib"
        - "./models/RF_{target_mode}.joblib"
        - "./models/ET_{target_mode}.joblib"
        - "./models/HGB_{target_mode}.joblib"
        - "./models/MLP_{target_mode}.joblib"
        - "./models/Stacking_{target_mode}.joblib"
      description: "Modelos individuais e ensemble serializados para avaliação e inferência independente."

visualization_and_metrics:
  plotting_libraries:
    - name: "matplotlib"
      version: ">=3.8.0"
      modules:
        - "matplotlib.pyplot"
      purpose: "Geração de gráficos comparativos (barras agrupadas, curvas ROC com zoom embutido, scatter de latência vs F1 e pesos de coeficientes do SVM)."
    - name: "seaborn"
      version: ">=0.13.0"
      modules:
        - "seaborn.heatmap"
      purpose: "Renderização de matrizes de confusão normalizadas e heatmaps de pesos do LinearSVC por classe."

  metrics_and_evaluation:
    framework: "scikit-learn"
    module: "sklearn.metrics"
    metrics_list:
      - name: "accuracy_score"
        purpose: "Acurácia global de predição."
      - name: "precision_score"
        purpose: "Precisão (média 'binary' para modo binário e 'macro' para modo multiclasse)."
      - name: "recall_score"
        purpose: "Sensibilidade/Revocação (média 'binary' para binário e 'macro' para multiclasse)."
      - name: "f1_score"
        purpose: "Média harmônica balanceada entre Precisão e Recall."
      - name: "roc_curve / auc"
        purpose: "Curvas ROC com cálculo de AUC para classificação binária e ROC Macro-Average binarizada para multiclasse."
      - name: "confusion_matrix"
        purpose: "Matrizes de confusão com normalização proporcional por classe verdadeira."
      - name: "classification_report"
        purpose: "Relatório de métricas por classe impresso no terminal."
    plots_generated:
      - path: "./results/metrics_comparison_{mode}.png"
        description: "Gráfico de barras agrupadas comparando Acurácia, Precisão, Recall e F1-Score com escala percentual (0-120%), rótulos a 45° e legenda externa."
      - path: "./results/confusion_matrices_{mode}.png"
        description: "Grid horizontal de subplots com matrizes de confusão normalizadas e rótulos nominais ('Benigno'/'Maligno' no modo binário)."
      - path: "./results/roc_curves_{mode}.png"
        description: "Curvas ROC de todos os modelos avaliados com painel de zoom (inset plot) no canto superior esquerdo para modo binário."
      - path: "./results/roc_curves_macro_{mode}.png"
        description: "Curva ROC Macro-Average com painel de zoom para modo multiclasse."
      - path: "./results/latency_vs_f1_{mode}.png"
        description: "Scatter plot de latência de inferência (ms por 1.000 amostras) versus F1-Score com anotações de cada modelo."
      - path: "./results/svm_feature_weights_{mode}.png"
        description: "Gráfico horizontal dos Top 25 coeficientes do LinearSVC (vermelho para tendência a ataque, azul para tendência benigna em binário; heatmap em multiclasse)."

edge_deployment:
  target_platform: "Raspberry Pi (3B+, 4B, 5, Zero 2 W) / Debian Linux"
  directory: "raspberry_pi/"
  deployment_path: "/etc/aids"
  setup_automation:
    script: "setup_rpi.sh"
    purpose: "Provisionamento automatizado do dispositivo Edge do zero para produção."
    actions:
      - "Instalação de dependências do sistema operacional Linux (libpcap-dev, tcpdump, iptables-persistent, netfilter-persistent, libcap2-bin)"
      - "Migração e estruturação do projeto no diretório padronizado /etc/aids"
      - "Criação de ambiente virtual limpo em /etc/aids/.venv e atualização de pacotes via python3 -m pip"
      - "Concessão de Linux Capabilities (CAP_NET_RAW, CAP_NET_ADMIN) ao binário Python para execução com privilégios mínimos"
      - "Configuração de IP forwarding (sysctl net.ipv4.ip_forward=1) e NAT Masquerade no iptables"
      - "Instalação, habilitação e inicialização do serviço systemd aids-rpi.service com reinício automático (Restart=always)"

  libraries:
    - name: "scapy"
      version: ">=2.5.0"
      purpose: "Sniffing e dissecação de pacotes brutos de rede IPv4 TCP/UDP em tempo real e leitura streaming de arquivos PCAP."
    - name: "psutil"
      version: ">=5.9.0"
      purpose: "Monitoramento em tempo real do uso de CPU e consumo de memória RAM do Raspberry Pi."
    - name: "smtplib / email.mime"
      purpose: "Envio de alertas de intrusão autenticados e seguros via SMTP (TLS/SSL) em background assíncrono com proteção anti-flood/cooldown."

  traffic_filtering:
    broadcast_multicast:
      description: "Descarte de pacotes enviados a endereços broadcast (255.255.255.255, x.x.x.255) e multicast (224.0.0.0/4 como SSDP 239.255.255.250 e mDNS 224.0.0.251)."
    local_discovery_ports:
      description: "Supressão de tráfego em portas de serviços locais legítimos (SSDP 1900, mDNS 5353, LLMNR 5355, NetBIOS 137/138, Steam 27036, DHCP 67/68)."

  audit_logging:
    tool: "DetectionLogger"
    file: "logs/detections.jsonl"
    formats:
      - "jsonl"
      - "csv"
      - "text"
      - "all"
    rotation: "Rotação automática por limite de tamanho (RotatingFileHandler com padrão de 5 MB e 3 backups)"
    enriched_fields:
      - "dt_attack_type"
      - "dt_confidence"
      - "dt_probabilities"
      - "flow_metrics (duration, packets, bytes, rates)"
      - "tcp_flags"
      - "mitigation_rule (comando iptables gerado automaticamente)"

  service_management:
    tool: "systemd"
    unit_file: "raspberry_pi/aids-rpi.service"
    security_capabilities:
      - "CAP_NET_RAW"
      - "CAP_NET_ADMIN"
    purpose: "Execução contínua como daemon no boot do Raspberry Pi com privilégios mínimos de rede sem necessidade de root."

  network_configuration:
    topology_mode: "Gateway Padrão / Default Gateway (Método 1)"
    description: "Configuração do Raspberry Pi como roteador e gateway padrão da rede doméstica LAN para interceptar e analisar todo o tráfego de saída."
    components:
      - name: "IP Forwarding"
        command: "sysctl net.ipv4.ip_forward=1"
        purpose: "Habilita o roteamento de pacotes IPv4 entre as interfaces de rede do Raspberry Pi."
      - name: "NAT / Masquerading"
        tool: "iptables / nftables"
        command: "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE"
        purpose: "Mascaramento e repasse de pacotes da rede local para a interface conectada à internet."
      - name: "DHCP Integration"
        target: "Roteador Wi-Fi / Modem Principal"
        purpose: "Redirecionamento do parâmetro Default Gateway no DHCP para o IP estático do Raspberry Pi (ex: 192.168.1.2)."

testing_and_simulation:
  synthetic_traffic_generator:
    script: "simulate_traffic.py"
    purpose: "Simulador interativo de tráfego de rede para validação de regras e modelos em ambiente de laboratório."
    attack_vectors:
      - id: 1
        name: "Fuzzers"
        description: "Pacotes HTTP com URIs fuzzeadas e cabeçalhos randômicos."
      - id: 2
        name: "Brute Force"
        description: "Tentativas repetidas de autenticação padronizada (Analysis / Generic)."
      - id: 3
        name: "C2 Beaconing"
        description: "Sinais de batimento (heartbeats) com intervalo fixo (IAT Std nulo)."
      - id: 4
        name: "Worm Propagation"
        description: "Varredura horizontal da sub-rede local em porta única (ex: SMB 445)."
      - id: 5
        name: "DoS Flood"
        description: "Inundação rápida de conexões TCP na mesma porta (validação de CONN_FLOOD_THRESHOLD)."
      - id: 6
        name: "Reconnaissance"
        description: "Varredura vertical em múltiplas portas sequenciais (validação de PORT_SCAN_THRESHOLD)."

