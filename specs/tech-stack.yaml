project:
  name: "AIDS-Alternative-Traffic-Detection"
  description: "Algoritmo de Machine Learning para Detecção de Tráfego de Rede Maligno e Benigno usando Stacking Ensemble (LinearSVC Calibrado + Random Forest + Extra Trees) em modos Binário e Multiclasse"
  version: "1.0.0"
  domain: "Cybersecurity / Intrusion Detection System (AIDS)"

environment:
  python:
    version: ">=3.10, <3.12"
  virtual_environment:
    mandatory: true
    tool: "venv"
    directory: ".venv"
    activation:
      windows: ".venv\\Scripts\\activate"
      linux_mac: "source .venv/bin/activate"
    description: "Obrigatório a criação e ativação de um ambiente virtual Python (.venv) para isolar todas as dependências do projeto."
  configuration:
    tool: "python-dotenv"
    file: ".env"
    description: "Arquivo de configuração dinâmico para controle de amostragem, toggles de treinamento de modelos e modos de execução (binário/multiclasse)."

core_libraries:
  data_manipulation:
    - name: "pandas"
      version: "^2.1.0"
      purpose: "Carregamento, amostragem estratificada, limpeza de nulos/infinitos e manipulação dos dados de tráfego de rede."
    - name: "numpy"
      version: "^1.26.0"
      purpose: "Operações vetoriais, tratamento de valores inf/nan e suporte numérico de alta performance."
  configuration_management:
    - name: "python-dotenv"
      version: "^1.0.0"
      purpose: "Carregamento automatizado das configurações de execução contidas no arquivo .env."

machine_learning:
  framework: "scikit-learn"
  version: "^1.3.0"
  execution_modes:
    - name: "binary"
      description: "Classificação em duas classes: Benigno (0) vs Maligno (1)."
    - name: "multiclass"
      description: "Classificação direta nos rótulos de tipo de ataque presentes no dataset."
  components:
    base_learners:
      - name: "Linear Support Vector Classifier (LinearSVC)"
        module: "sklearn.svm.LinearSVC"
        hyperparameters:
          C: 1.0
          loss: "squared_hinge"
          dual: false
          tol: 1e-3
          max_iter: 2000
          class_weight: "balanced"
          random_state: 42
        purpose: "Classificador SVM linear de alta velocidade O(N), com tolerância de convergência otimizada para rápida computação."

      - name: "Calibrated LinearSVC"
        module: "sklearn.calibration.CalibratedClassifierCV"
        hyperparameters:
          base_estimator: "LinearSVC(C=1.0, loss='squared_hinge', dual=False, tol=1e-3, max_iter=2000, class_weight='balanced', random_state=42)"
          cv: 3
        purpose: "Empacotamento do LinearSVC para calibração de probabilidades de classe necessárias no Stacking."

      - name: "Random Forest Classifier"
        module: "sklearn.ensemble.RandomForestClassifier"
        hyperparameters:
          n_estimators: 70
          max_depth: 15
          min_samples_split: 5
          min_samples_leaf: 2
          max_features: "sqrt"
          class_weight: "balanced"
          n_jobs: -1
          random_state: 42
        purpose: "Ensemble de árvores de decisão otimizado com amostragem bootstrap e balanceamento de peso de classes."

      - name: "Extra Trees Classifier"
        module: "sklearn.ensemble.ExtraTreesClassifier"
        hyperparameters:
          n_estimators: 70
          max_depth: 15
          min_samples_split: 5
          min_samples_leaf: 2
          max_features: "sqrt"
          class_weight: "balanced"
          n_jobs: -1
          random_state: 42
        purpose: "Ensemble de árvores extremamente aleatórias aumentando a diversidade dos estimadores base do Stacking."

      - name: "Decision Tree Classifier"
        module: "sklearn.tree.DecisionTreeClassifier"
        hyperparameters:
          max_depth: 15
          min_samples_split: 5
          min_samples_leaf: 2
          class_weight: "balanced"
          random_state: 42
        purpose: "Modelo isolado de árvore de decisão única utilizado para comparações de baseline."

    meta_learner:
      name: "Logistic Regression CV"
      module: "sklearn.linear_model.LogisticRegressionCV"
      hyperparameters:
        Cs: [0.01, 0.1, 1.0, 10.0, 100.0]
        cv: 3
        solver: "lbfgs"
        max_iter: 1000
        class_weight: "balanced"
        random_state: 42
      purpose: "Combinação ponderada com ajuste dinâmico da força de regularização via validação cruzada out-of-fold."

    stacking_ensemble:
      module: "sklearn.ensemble.StackingClassifier"
      base_estimators:
        - "linearsvcCalibrated"
        - "et"
        - "hgb"
        - "dt"
      cross_validation: "StratifiedKFold(n_splits=3, shuffle=True, random_state=42)"
      passthrough: true
      n_jobs: -1

feature_engineering_and_preprocessing:
  pipeline_structure: "ColumnTransformer com Pipelines dedicados para variáveis numéricas e categóricas"
  scaling:
    - name: "RobustScaler"
      module: "sklearn.preprocessing.RobustScaler"
      purpose: "Escalonamento robusto a ruídos e outliers numéricos (opção padrão do pipeline)."
    - name: "StandardScaler"
      module: "sklearn.preprocessing.StandardScaler"
      purpose: "Padronização Z-score para atributos numéricos."

  imputation_and_selection:
    - name: "SimpleImputer"
      module: "sklearn.impute.SimpleImputer"
      purpose: "Preenchimento de valores ausentes (estratégia 'median' para numéricos e 'constant' para categóricos)."
    - name: "VarianceThreshold"
      module: "sklearn.feature_selection.VarianceThreshold"
      threshold: 0.0
      purpose: "Remoção automática de atributos com variância zero após imputação."

  encoding:
    - name: "OneHotEncoder"
      module: "sklearn.preprocessing.OneHotEncoder"
      hyperparameters:
        handle_unknown: "ignore"
      purpose: "Codificação One-Hot para variáveis categóricas (ex: atributo Protocol)."

  imbalance_handling:
    - name: "SMOTE"
      package: "imbalanced-learn"
      version: "^0.11.0"
      module: "imblearn.over_sampling.SMOTE"
      purpose: "Balanceamento sintético de amostras da classe minoria com adaptação dinâmica de k_neighbors."
    - name: "class_weight"
      purpose: "Ponderação automática 'balanced' incorporada aos modelos Random Forest, Extra Trees, Decision Tree e Logistic Regression."

  feature_dropping:
    identifiers:
      - "Flow ID"
      - "Src IP"
      - "Dst IP"
      - "Timestamp"
    constants:
      - "Bwd PSH Flags"
      - "Fwd URG Flags"
      - "Bwd URG Flags"
      - "URG Flag Count"
      - "CWR Flag Count"
      - "ECE Flag Count"
      - "Fwd Bytes/Bulk Avg"
      - "Fwd Packet/Bulk Avg"
      - "Fwd Bulk Rate Avg"

model_persistence:
  library: "joblib"
  version: "^1.3.0"
  target_directory: "./models"
  format: ".joblib"
  naming_pattern: "models/{model_name}_{target_mode}.joblib"
  saved_artifacts:
    - name: "stacking_pipeline"
      path: "./models/stacking_pipeline_{target_mode}.joblib"
      description: "Pipeline completo contendo o ColumnTransformer e o Stacking Classifier."
    - name: "scaler"
      path: "./models/scaler_{target_mode}.joblib"
      description: "Objeto ColumnTransformer pré-processador ajustado."
    - name: "meta_learner"
      path: "./models/meta_learner_{target_mode}.joblib"
      description: "Meta-classificador final de Regressão Logística extraído do Stacking."
    - name: "individual_models"
      paths:
        - "./models/LinearSVC_{target_mode}.joblib"
        - "./models/DT_{target_mode}.joblib"
        - "./models/RF_{target_mode}.joblib"
        - "./models/Stacking_{target_mode}.joblib"
      description: "Modelos isolados e Stacking serializados para uso independente."

visualization_and_metrics:
  plotting_libraries:
    - name: "matplotlib"
      version: "^3.8.0"
      modules:
        - "matplotlib.pyplot"
      purpose: "Geração de gráficos comparativos (barras de métricas, curvas ROC com zoom e scatter de latência vs F1-score)."
    - name: "seaborn"
      version: "^0.13.0"
      modules:
        - "seaborn.heatmap"
      purpose: "Renderização de matrizes de confusão em subplots normalizados."

  metrics_and_evaluation:
    framework: "scikit-learn"
    module: "sklearn.metrics"
    metrics_list:
      - name: "accuracy_score"
        purpose: "Acurácia global do modelo."
      - name: "precision_score"
        purpose: "Precisão (suporta média 'binary' e 'macro' para multiclasse)."
      - name: "recall_score"
        purpose: "Sensibilidade (suporta média 'binary' e 'macro' para multiclasse)."
      - name: "f1_score"
        purpose: "Média harmônica entre Precisão e Recall."
      - name: "roc_curve / roc_auc_score / auc"
        purpose: "Cálculo da curva ROC comparativa (binária) e ROC Macro-Average com label_binarize (multiclasse)."
      - name: "confusion_matrix"
        purpose: "Geração de matrizes de confusão normalizadas."
      - name: "classification_report"
        purpose: "Relatório detalhado de métricas por classe impresso no console."

